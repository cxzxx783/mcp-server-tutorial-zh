<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#38bdf8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- 网格装饰 -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.5"/>
  </pattern>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>

  <!-- 标题 -->
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">MCP Server 中文教程</text>
  <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">从零开始，用 Python 构建你自己的 MCP Server</text>
  <text x="640" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">MCP Server Tutorial — Build your own MCP Server from scratch with Python</text>

  <!-- AI 图标（左侧） -->
  <g transform="translate(200, 380)">
    <circle cx="0" cy="0" r="60" fill="#1e40af" opacity="0.3"/>
    <circle cx="0" cy="0" r="45" fill="#2563eb" opacity="0.5"/>
    <circle cx="0" cy="0" r="30" fill="#3b82f6"/>
    <!-- 简化 AI 图标 -->
    <text x="0" y="10" text-anchor="middle" font-family="Arial" font-size="28" fill="white">AI</text>
    <text x="0" y="52" text-anchor="middle" font-family="Arial" font-size="12" fill="#93c5fd">你的 AI 应用</text>
  </g>

  <!-- MCP 协议连接线 -->
  <g transform="translate(300, 380)">
    <line x1="0" y1="0" x2="280" y2="0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8,4" opacity="0.8"/>
    <rect x="80" y="-14" width="120" height="28" rx="14" fill="#0ea5e9" opacity="0.9"/>
    <text x="140" y="4" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">MCP 协议</text>
  </g>

  <!-- Server 1 -->
  <g transform="translate(640, 290)">
    <rect x="-50" y="-35" width="100" height="70" rx="10" fill="#0f766e"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="22" fill="white">🔍</text>
    <text x="0" y="22" text-anchor="middle" font-family="Arial" font-size="13" fill="#99f6e4">搜索 Server</text>
  </g>

  <!-- Server 2 -->
  <g transform="translate(820, 290)">
    <rect x="-50" y="-35" width="100" height="70" rx="10" fill="#7c3aed"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="22" fill="white">📂</text>
    <text x="0" y="22" text-anchor="middle" font-family="Arial" font-size="13" fill="#ddd6fe">文件 Server</text>
  </g>

  <!-- Server 3 -->
  <g transform="translate(1000, 290)">
    <rect x="-50" y="-35" width="100" height="70" rx="10" fill="#b91c1c"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="22" fill="white">🗄️</text>
    <text x="0" y="22" text-anchor="middle" font-family="Arial" font-size="13" fill="#fca5a5">数据库 Server</text>
  </g>

  <!-- 连接线从协议到各 Server -->
  <path d="M 580 380 Q 610 330 640 325" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 580 380 Q 700 340 820 325" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 580 380 Q 790 350 1000 325" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- 底部提示 -->
  <text x="640" y="570" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">每个 Server 专注一件事 · Windows 友好 · 即学即用</text>
  <text x="640" y="595" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">⭐ 如果对你有帮助，点个 Star 支持一下！</text>
</svg>